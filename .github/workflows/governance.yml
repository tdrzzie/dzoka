name: Repository governance

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate source registry
        run: python3 tools/audit_registry.py check
      - name: Test integrity and gate failure paths
        run: python3 -m unittest discover -s tests -v
      - name: Require all mandatory source audits
        run: python3 tools/audit_registry.py gate
      - name: Verify architecture requirements and preserved source bodies
        run: python3 tools/verify_architecture.py
