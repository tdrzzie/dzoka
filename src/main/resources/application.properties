spring.application.name=dzoka-core
spring.datasource.url=${DZOKA_DB_URL}
spring.datasource.username=${DZOKA_DB_USER}
spring.datasource.password=${DZOKA_DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=8
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.auto-commit=true
spring.flyway.enabled=false
dzoka.security.issuer=${DZOKA_OIDC_ISSUER}
dzoka.security.jwk-set-uri=${DZOKA_OIDC_JWK_SET_URI}
dzoka.security.audience=${DZOKA_OIDC_AUDIENCE}
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.tomcat.max-http-form-post-size=16KB
# Bound rejected-body draining while allowing a just-over-limit image to receive its 413.
server.tomcat.max-swallow-size=6MB
server.max-http-request-header-size=16KB
spring.jackson.deserialization.fail-on-unknown-properties=true
dzoka.media.enabled=${DZOKA_MEDIA_ENABLED:false}
dzoka.media.endpoint=${DZOKA_MEDIA_ENDPOINT:}
dzoka.media.region=${DZOKA_MEDIA_REGION:}
dzoka.media.bucket=${DZOKA_MEDIA_BUCKET:}
dzoka.media.access-key=${DZOKA_MEDIA_ACCESS_KEY:}
dzoka.media.secret-key=${DZOKA_MEDIA_SECRET_KEY:}
dzoka.media.allow-insecure-loopback=${DZOKA_MEDIA_ALLOW_INSECURE_LOOPBACK:false}
