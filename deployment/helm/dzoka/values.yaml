image:
  repository: ""
  digest: ""
replicas: 2
# Enable only after verifying that both releases enforce the same governance/restore contracts.
compatibleRollingUpgrade: false
appSecret: ""
migrationSecret: ""
resources:
  requests: {cpu: 250m, memory: 384Mi}
  limits: {cpu: "2", memory: 768Mi}
network:
  # Explicit target DB, IdP and approved provider/telemetry CIDRs. Empty denies egress except DNS.
  egressCidrs: []
  gatewayPodLabels: {dzoka-api-gateway: "true"}
