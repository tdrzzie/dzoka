{{- $repository := required "Set image.repository to the reviewed core registry repository" .Values.image.repository -}}
{{- $digest := required "Set image.digest to sha256:<64 lowercase hex>" .Values.image.digest -}}
{{- if not (regexMatch "^sha256:[0-9a-f]{64}$" $digest) }}{{ fail "Invalid core image digest" }}{{ end -}}
{{- $appSecret := required "Set appSecret to an existing private configuration Secret" .Values.appSecret -}}
{{- $migrationSecret := required "Set migrationSecret to a separate existing migration Secret" .Values.migrationSecret -}}
{{- if eq $appSecret $migrationSecret }}{{ fail "Application and migration secrets must differ" }}{{ end -}}
{{- if lt (int .Values.replicas) 2 }}{{ fail "The cluster profile requires at least two core replicas" }}{{ end -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-core
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-core
spec:
  replicas: {{ .Values.replicas }}
  revisionHistoryLimit: 3
  strategy:
    {{- if .Values.compatibleRollingUpgrade }}
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
    {{- else }}
    type: Recreate
    {{- end }}
  selector:
    matchLabels: {app: {{ .Release.Name }}-core}
  template:
    metadata:
      labels: {app: {{ .Release.Name }}-core}
    spec:
      serviceAccountName: {{ .Release.Name }}-core
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels: {app: {{ .Release.Name }}-core}
      containers:
        - name: core
          image: "{{ $repository }}@{{ $digest }}"
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: 8080}]
          env:
            - {name: SPRING_CONFIG_IMPORT, value: "configtree:/run/config/"}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          startupProbe:
            httpGet: {path: /health/ready, port: http}
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /health/ready, port: http}
            periodSeconds: 10
            timeoutSeconds: 7
          livenessProbe:
            httpGet: {path: /health/live, port: http}
            periodSeconds: 15
          volumeMounts:
            - {name: config, mountPath: /run/config, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: config
          secret: {secretName: {{ $appSecret }}, defaultMode: 0440}
        - name: tmp
          emptyDir: {medium: Memory, sizeLimit: 64Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-core
spec:
  type: ClusterIP
  selector: {app: {{ .Release.Name }}-core}
  ports: [{name: http, port: 8080, targetPort: http}]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ .Release.Name }}-core
spec:
  minAvailable: 1
  selector:
    matchLabels: {app: {{ .Release.Name }}-core}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-migrate-{{ .Release.Revision }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels: {app: {{ .Release.Name }}-migrate}
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: migrate
          image: "{{ $repository }}@{{ $digest }}"
          args: [org.dzoka.foundation.persistence.MigrateDatabase]
          envFrom:
            - secretRef: {name: {{ $migrationSecret }}}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources: {requests: {cpu: 250m, memory: 256Mi}, limits: {cpu: "1", memory: 512Mi}}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes:
        - name: tmp
          emptyDir: {medium: Memory, sizeLimit: 64Mi}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-core
spec:
  podSelector:
    matchLabels: {app: {{ .Release.Name }}-core}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- toYaml .Values.network.gatewayPodLabels | nindent 14 }}
      ports: [{protocol: TCP, port: 8080}]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
    {{- range .Values.network.egressCidrs }}
    - to: [{ipBlock: {cidr: {{ . | quote }}}}]
      ports: [{protocol: TCP, port: 5432}, {protocol: TCP, port: 443}]
    {{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-migrate
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  podSelector:
    matchLabels: {app: {{ .Release.Name }}-migrate}
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
    {{- range .Values.network.egressCidrs }}
    - to: [{ipBlock: {cidr: {{ . | quote }}}}]
      ports: [{protocol: TCP, port: 5432}]
    {{- end }}
